services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: artemis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artemis"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://app:3000
      WEB_URL: http://localhost:8088
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/artemis
      REDIS_URL: redis://redis:6379
      START_WORKERS: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  caddy:
    image: caddy:2
    ports:
      - "8088:80"
      - "8443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pg_data:
